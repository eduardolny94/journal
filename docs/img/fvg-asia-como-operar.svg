<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif" font-size="14"><rect width="1200" height="760" fill="#0f1419"/><text x="40" y="34" fill="#fff" font-size="20" font-weight="bold" text-anchor="start">Cómo operar el FVG de 4 h de Asia (regla medida en 10 pares, 2015–2026: 62 % a 1R, +0,22R con costes)</text><text x="40" y="56" fill="#9aa4ad" font-size="13" font-weight="normal" text-anchor="start">Esquema de una COMPRA. Para una venta es el espejo (hueco por encima, Asia cerrando a la baja, límite al 50 %, stop 10 pips por encima del borde superior).</text><rect x="60" y="90" width="120" height="470" fill="#f3722c" opacity="0.09"/><text x="120" y="582" fill="#f3722c" font-size="13" font-weight="bold" text-anchor="middle">NUEVA YORK (final)</text><text x="120" y="600" fill="#9aa4ad" font-size="11" font-weight="normal" text-anchor="middle">14:00–18:00 NY · vela 4 h nº 1</text><rect x="180" y="90" width="240" height="470" fill="#4cc9f0" opacity="0.09"/><text x="300" y="582" fill="#4cc9f0" font-size="13" font-weight="bold" text-anchor="middle">ASIA 18:00–02:00 NY</text><text x="300" y="600" fill="#9aa4ad" font-size="11" font-weight="normal" text-anchor="middle">00:00–08:00 España · velas 4 h nº 2 y nº 3</text><rect x="420" y="90" width="140" height="470" fill="#f9c74f" opacity="0.09"/><text x="490" y="582" fill="#f9c74f" font-size="13" font-weight="bold" text-anchor="middle">LONDRES</text><text x="490" y="600" fill="#9aa4ad" font-size="11" font-weight="normal" text-anchor="middle">02:00–08:00 NY · 08:00–14:00 España</text><line x1="120" x2="120" y1="372" y2="456.6" stroke="#06d6a0" stroke-width="2"/><rect x="100" y="400.2" width="40" height="18.80000000000001" fill="#06d6a0"/><line x1="240" x2="240" y1="231" y2="404.9" stroke="#06d6a0" stroke-width="2"/><rect x="220" y="249.8" width="40" height="141" fill="#06d6a0"/><line x1="360" x2="360" y1="193.39999999999998" y2="315.6" stroke="#ef476f" stroke-width="2"/><rect x="340" y="249.8" width="40" height="28.19999999999999" fill="#ef476f"/><rect x="100" y="315.6" width="460" height="56.39999999999998" fill="#b5179e" opacity="0.35"/><text x="440" y="309.6" fill="#f72585" font-size="12" font-weight="bold" text-anchor="start">FVG 4 h = hueco entre el MÁXIMO de la vela 1 y el MÍNIMO de la vela 3</text><line x1="180" x2="560" y1="193.39999999999998" y2="193.39999999999998" stroke="#4cc9f0" stroke-dasharray="5 4"/><text x="556" y="188.39999999999998" fill="#4cc9f0" font-size="12" font-weight="normal" text-anchor="end">máximo de Asia</text><line x1="180" x2="560" y1="404.9" y2="404.9" stroke="#4cc9f0" stroke-dasharray="5 4"/><text x="556" y="419.9" fill="#4cc9f0" font-size="12" font-weight="normal" text-anchor="end">mínimo de Asia</text><line x1="440" x2="440" y1="263.9" y2="334.4" stroke="#ef476f" stroke-width="2"/><rect x="433" y="278" width="14" height="9.400000000000034" fill="#ef476f"/><line x1="465" x2="465" y1="278" y2="348.5" stroke="#ef476f" stroke-width="2"/><rect x="458" y="287.40000000000003" width="14" height="51.69999999999999" fill="#ef476f"/><line x1="490" x2="490" y1="315.6" y2="353.2" stroke="#06d6a0" stroke-width="2"/><rect x="483" y="325" width="14" height="14.100000000000023" fill="#06d6a0"/><line x1="515" x2="515" y1="287.40000000000003" y2="329.70000000000005" stroke="#06d6a0" stroke-width="2"/><rect x="508" y="292.1" width="14" height="32.89999999999998" fill="#06d6a0"/><line x1="540" x2="540" y1="259.2" y2="301.5" stroke="#06d6a0" stroke-width="2"/><rect x="533" y="268.6" width="14" height="23.5" fill="#06d6a0"/><line x1="420" x2="560" y1="343.79999999999995" y2="343.79999999999995" stroke="#ffffff" stroke-width="2"/><text x="568" y="348.79999999999995" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start">ENTRADA · límite al 50 % del hueco</text><line x1="420" x2="560" y1="419" y2="419" stroke="#ef476f" stroke-width="2"/><text x="568" y="424" fill="#ef476f" font-size="13" font-weight="bold" text-anchor="start">STOP · 10 pips por debajo del borde inferior</text><line x1="420" x2="560" y1="268.6" y2="268.6" stroke="#06d6a0" stroke-width="2"/><text x="568" y="273.6" fill="#06d6a0" font-size="13" font-weight="bold" text-anchor="start">OBJETIVO · 1R (misma distancia que el stop)</text><circle cx="465" cy="343.79999999999995" r="8" fill="none" stroke="#fff" stroke-width="2"/><text x="440" y="160.5" fill="#f9c74f" font-size="11" font-weight="normal" text-anchor="start">⚠ primera hora de Londres (08:00–08:59 España): no entrar; si toca aquí suele atravesar</text><text x="475" y="362.6" fill="#fff" font-size="11" font-weight="normal" text-anchor="start">toque ≥ 09:00 España ✔</text><text x="600" y="100" fill="#fff" font-size="15" font-weight="bold" text-anchor="start">1. Al cerrar Asia (08:00 España) mira tres velas de 4 h</text><text x="616" y="120" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">vela 1 = 14:00–18:00 NY (final de Nueva York) · vela 2 = 18:00–22:00 NY · vela 3 = 22:00–02:00 NY.</text><text x="616" y="138" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Compra: el MÍNIMO de la vela 3 queda por encima del MÁXIMO de la vela 1 → ese hueco es el FVG.</text><text x="616" y="156" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Venta: el MÁXIMO de la vela 3 queda por debajo del MÍNIMO de la vela 1.</text><text x="600" y="184" fill="#fff" font-size="15" font-weight="bold" text-anchor="start">2. Filtros (los dos a la vez)</text><text x="616" y="204" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Asia cerró en la dirección del FVG (cierre de las 02:00 NY por encima de su apertura si es compra).</text><text x="616" y="222" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">El hueco está intacto: el precio no volvió a entrar en él y Londres abre fuera (por encima si es compra).</text><text x="600" y="250" fill="#fff" font-size="15" font-weight="bold" text-anchor="start">3. Coloca la orden</text><text x="616" y="270" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Límite justo en el 50 % del hueco (mitad entre el borde superior y el inferior).</text><text x="616" y="288" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Stop 10 pips por debajo del borde inferior del hueco (venta: 10 pips por encima del superior).</text><text x="616" y="306" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Objetivo 1R: la misma distancia entrada→stop, hacia arriba. Riesgo típico 13–18 pips.</text><text x="600" y="334" fill="#fff" font-size="15" font-weight="bold" text-anchor="start">4. Cuándo vale el toque</text><text x="616" y="354" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Si el precio llega a la orden entre las 08:00 y las 08:59 España, es la hora de la barrida: 52 % de acierto.</text><text x="616" y="372" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Desde las 09:00 España el toque vale: 62 % de acierto, +0,22R con costes. Si no se llena antes de las 14:00, se cancela.</text><text x="600" y="400" fill="#fff" font-size="15" font-weight="bold" text-anchor="start">5. Gestión</text><text x="616" y="420" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Nada de mover el stop ni de parciales: sale por stop, por objetivo o se cierra al final del día (17:00 NY).</text><text x="616" y="438" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Riesgo fijo por operación (1 %). Una operación por par y día. Mejor en pares con Asia ancha: USDCAD, EURUSD,</text><text x="616" y="456" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">EURNZD, USDJPY, GBPCAD, USDCHF, GBPNZD. Flojo en EURGBP, AUDNZD y en los pares de Asia (AUDUSD, NZDUSD, AUDCHF).</text><text x="600" y="490" fill="#fff" font-size="15" font-weight="bold" text-anchor="start">¿Stop más ancho? ¿Objetivo 2R? (10 pares, 11 años, costes reales)</text><text x="600" y="514" fill="#fff" font-size="14" font-weight="normal" text-anchor="start"></text><text x="730" y="514" fill="#9aa4ad" font-size="12" font-weight="bold" text-anchor="start">objetivo 1R</text><text x="890" y="514" fill="#9aa4ad" font-size="12" font-weight="bold" text-anchor="start">objetivo 1,5R</text><text x="1050" y="514" fill="#9aa4ad" font-size="12" font-weight="bold" text-anchor="start">objetivo 2R</text><text x="600" y="534" fill="#c9d1d9" font-size="13" font-weight="bold" text-anchor="start">stop 10 pips</text><text x="730" y="534" fill="#06d6a0" font-size="13" font-weight="normal" text-anchor="start">62 % · +0,22R</text><text x="890" y="534" fill="#f9c74f" font-size="13" font-weight="normal" text-anchor="start">48 % · +0,14R</text><text x="1050" y="534" fill="#ef476f" font-size="13" font-weight="normal" text-anchor="start">40 % · +0,05R</text><text x="600" y="554" fill="#c9d1d9" font-size="13" font-weight="bold" text-anchor="start">stop 12 pips</text><text x="730" y="554" fill="#06d6a0" font-size="13" font-weight="normal" text-anchor="start">61 % · +0,20R</text><text x="890" y="554" fill="#f9c74f" font-size="13" font-weight="normal" text-anchor="start">47 % · +0,09R</text><text x="1050" y="554" fill="#ef476f" font-size="13" font-weight="normal" text-anchor="start">39 % · +0,02R</text><text x="600" y="574" fill="#c9d1d9" font-size="13" font-weight="bold" text-anchor="start">stop 14 pips</text><text x="730" y="574" fill="#06d6a0" font-size="13" font-weight="normal" text-anchor="start">60 % · +0,17R</text><text x="890" y="574" fill="#f9c74f" font-size="13" font-weight="normal" text-anchor="start">46 % · +0,06R</text><text x="1050" y="574" fill="#ef476f" font-size="13" font-weight="normal" text-anchor="start">39 % · −0,01R</text><text x="600" y="602" fill="#9aa4ad" font-size="12" font-weight="normal" text-anchor="start">Agrandar el stop no mejora: el objetivo se aleja igual y el acierto baja. Para 1:2 el mejor par es GBPNZD (45 %, +0,24R);</text><text x="600" y="619" fill="#9aa4ad" font-size="12" font-weight="normal" text-anchor="start">para 1:1,5 también GBPNZD (56 %, +0,35R). El resto a 2R queda en 35–43 %: casi todo el beneficio está en el 1R.</text></svg>