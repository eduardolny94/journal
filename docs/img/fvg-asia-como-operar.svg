<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Helvetica, Arial, sans-serif" font-size="15"><rect width="1400" height="1000" fill="#0f1419"/><text x="40" y="40" fill="#fff" font-size="22" font-weight="bold" text-anchor="start">Cómo operar el FVG de 4 h de Asia · regla medida en 10 pares, 2015–2026: 62 % a 1R (+0,22R) con costes</text><text x="40" y="64" fill="#9aa4ad" font-size="14" font-weight="normal" text-anchor="start">Esquema de una COMPRA. La venta es el espejo: hueco por encima del precio, Asia cerrando a la baja, límite al 50 %, stop 10 pips por encima del borde superior.</text><rect x="60" y="100" width="240" height="440" fill="#f3722c" opacity="0.09"/><text x="180" y="564" fill="#f3722c" font-size="14" font-weight="bold" text-anchor="middle">NUEVA YORK (final)</text><text x="180" y="582" fill="#9aa4ad" font-size="12" font-weight="normal" text-anchor="middle">14:00–18:00 NY · vela 4 h nº 1</text><rect x="300" y="100" width="400" height="440" fill="#4cc9f0" opacity="0.09"/><text x="500" y="564" fill="#4cc9f0" font-size="14" font-weight="bold" text-anchor="middle">ASIA 18:00–02:00 NY</text><text x="500" y="582" fill="#9aa4ad" font-size="12" font-weight="normal" text-anchor="middle">00:00–08:00 España · velas 4 h nº 2 y nº 3</text><rect x="700" y="100" width="300" height="440" fill="#f9c74f" opacity="0.09"/><text x="850" y="564" fill="#f9c74f" font-size="14" font-weight="bold" text-anchor="middle">LONDRES 02:00–08:00 NY</text><text x="850" y="582" fill="#9aa4ad" font-size="12" font-weight="normal" text-anchor="middle">08:00–14:00 España</text><line x1="180" x2="180" y1="364" y2="443.2" stroke="#06d6a0" stroke-width="2"/><rect x="150" y="390.4" width="60" height="17.600000000000023" fill="#06d6a0"/><text x="180" y="452" fill="#f3722c" font-size="13" font-weight="bold" text-anchor="middle">vela 1</text><line x1="400" x2="400" y1="232" y2="394.79999999999995" stroke="#06d6a0" stroke-width="2"/><rect x="370" y="249.59999999999997" width="60" height="132.00000000000006" fill="#06d6a0"/><text x="400" y="210" fill="#4cc9f0" font-size="13" font-weight="bold" text-anchor="middle">vela 2 (deja el hueco)</text><line x1="600" x2="600" y1="196.8" y2="311.2" stroke="#ef476f" stroke-width="2"/><rect x="570" y="249.59999999999997" width="60" height="26.400000000000034" fill="#ef476f"/><text x="600" y="174.8" fill="#4cc9f0" font-size="13" font-weight="bold" text-anchor="middle">vela 3</text><rect x="150" y="311.2" width="850" height="52.80000000000001" fill="#b5179e" opacity="0.35"/><text x="640" y="342.6" fill="#f72585" font-size="13" font-weight="bold" text-anchor="end">FVG 4 h = hueco entre el MÁXIMO de la vela 1 y el MÍNIMO de la vela 3</text><line x1="300" x2="1000" y1="196.8" y2="196.8" stroke="#4cc9f0" stroke-dasharray="5 4"/><text x="1010" y="201.8" fill="#4cc9f0" font-size="13" font-weight="normal" text-anchor="start">máximo de Asia</text><line x1="300" x2="1000" y1="394.79999999999995" y2="394.79999999999995" stroke="#4cc9f0" stroke-dasharray="5 4"/><text x="1010" y="399.79999999999995" fill="#4cc9f0" font-size="13" font-weight="normal" text-anchor="start">mínimo de Asia</text><line x1="735" x2="735" y1="262.8" y2="328.8" stroke="#ef476f" stroke-width="2"/><rect x="725" y="276" width="20" height="8.800000000000011" fill="#ef476f"/><line x1="775" x2="775" y1="276" y2="342" stroke="#ef476f" stroke-width="2"/><rect x="765" y="284.8" width="20" height="48.400000000000034" fill="#ef476f"/><line x1="815" x2="815" y1="311.2" y2="346.4" stroke="#06d6a0" stroke-width="2"/><rect x="805" y="320" width="20" height="13.200000000000045" fill="#06d6a0"/><line x1="855" x2="855" y1="284.8" y2="324.4" stroke="#06d6a0" stroke-width="2"/><rect x="845" y="289.20000000000005" width="20" height="30.799999999999955" fill="#06d6a0"/><line x1="895" x2="895" y1="258.4" y2="298" stroke="#06d6a0" stroke-width="2"/><rect x="885" y="267.2" width="20" height="22.000000000000057" fill="#06d6a0"/><line x1="935" x2="935" y1="249.59999999999997" y2="276" stroke="#06d6a0" stroke-width="2"/><rect x="925" y="254" width="20" height="13.199999999999989" fill="#06d6a0"/><line x1="700" x2="1000" y1="337.6" y2="337.6" stroke="#ffffff" stroke-width="2.5"/><text x="1010" y="342.6" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="start">ENTRADA</text><text x="1010" y="359.6" fill="#9aa4ad" font-size="12" font-weight="normal" text-anchor="start">límite al 50 % del hueco</text><line x1="700" x2="1000" y1="408" y2="408" stroke="#ef476f" stroke-width="2.5"/><text x="1010" y="413" fill="#ef476f" font-size="14" font-weight="bold" text-anchor="start">STOP</text><text x="1010" y="430" fill="#9aa4ad" font-size="12" font-weight="normal" text-anchor="start">10 pips por debajo del borde inferior</text><line x1="700" x2="1000" y1="267.2" y2="267.2" stroke="#06d6a0" stroke-width="2.5"/><text x="1010" y="272.2" fill="#06d6a0" font-size="14" font-weight="bold" text-anchor="start">OBJETIVO 1R</text><text x="1010" y="289.2" fill="#9aa4ad" font-size="12" font-weight="normal" text-anchor="start">la misma distancia que el stop</text><circle cx="775" cy="337.6" r="9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="790" y="334.4" fill="#fff" font-size="12" font-weight="normal" text-anchor="start">toque válido (≥ 09:00 España)</text><rect x="702" y="104" width="36" height="432" fill="none" stroke="#f9c74f" stroke-dasharray="4 3"/><text x="740" y="122" fill="#f9c74f" font-size="12" font-weight="normal" text-anchor="start">⚠ 08:00–08:59 España: no entrar</text><text x="740" y="138" fill="#f9c74f" font-size="11" font-weight="normal" text-anchor="start">(hora de la barrida, 52 % de acierto)</text><text x="40" y="625" fill="#fff" font-size="16" font-weight="bold" text-anchor="start">1. Al cerrar Asia (08:00 España) mira tres velas de 4 h</text><text x="54" y="647" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">vela 1 = 14:00–18:00 NY · vela 2 = 18:00–22:00 NY · vela 3 = 22:00–02:00 NY.</text><text x="54" y="665" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Compra: el MÍNIMO de la vela 3 por encima del MÁXIMO de la vela 1 → ese hueco es el FVG.</text><text x="54" y="683" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Venta: el MÁXIMO de la vela 3 por debajo del MÍNIMO de la vela 1.</text><text x="40" y="713" fill="#fff" font-size="16" font-weight="bold" text-anchor="start">2. Dos filtros</text><text x="54" y="735" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Asia cerró en la dirección del FVG (cierre de las 02:00 NY por encima de su apertura, si es compra).</text><text x="54" y="753" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">El hueco está intacto: el precio no volvió a entrar en él y Londres abre fuera (por encima, si es compra).</text><text x="40" y="783" fill="#fff" font-size="16" font-weight="bold" text-anchor="start">3. Coloca la orden</text><text x="54" y="805" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Límite en el 50 % del hueco. Stop 10 pips por debajo del borde inferior (8 pips en GBPNZD).</text><text x="54" y="823" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Objetivo 1R: la misma distancia entrada→stop. Riesgo típico 13–18 pips (22 en GBPNZD).</text><text x="720" y="625" fill="#fff" font-size="16" font-weight="bold" text-anchor="start">4. Cuándo vale el toque</text><text x="734" y="647" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Entre las 08:00 y las 08:59 España es la hora de la barrida: 52 % de acierto. No entrar.</text><text x="734" y="665" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Desde las 09:00 España el toque vale: 62 % de acierto. Si no se llena antes de las 14:00, se cancela.</text><text x="734" y="683" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">El 55 % de los toques válidos llegan entre las 09:00 y las 09:59; el 20 % entre las 10:00 y las 10:59.</text><text x="720" y="713" fill="#fff" font-size="16" font-weight="bold" text-anchor="start">5. Gestión</text><text x="734" y="735" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Sin mover el stop ni parciales: sale por stop, por objetivo o al final del día (17:00 NY).</text><text x="734" y="753" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Riesgo fijo (1 %). Una operación por par y día.</text><text x="734" y="771" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Pares a 1R: USDCAD, EURUSD, EURNZD, USDJPY, GBPCAD, USDCHF, GBPNZD. Flojos: EURGBP, AUDNZD, AUDUSD.</text><text x="720" y="801" fill="#fff" font-size="16" font-weight="bold" text-anchor="start">6. Si quieres 1:1,5 o 1:2</text><text x="734" y="823" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">Solo GBPNZD con Asia ancha (≥ 62 pips) y stop 8 pips: 61 % a 1,5R (+0,47R) · 51 % a 2R (+0,42R).</text><text x="734" y="841" fill="#c9d1d9" font-size="13" font-weight="normal" text-anchor="start">En el resto de pares el 2R se queda en 40 %. Agrandar el stop a 12–14 pips no mejora.</text></svg>